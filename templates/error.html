{% extends 'base.html' %}
{% block title %}Ошибка {{ code }} | Семейный архив{% endblock %}
{% block content %}
<section class="empty error-page">
  <p class="eyebrow">ОШИБКА {{ code }}</p>
  <h1 class="page-title">Не получилось выполнить действие</h1>
  <p>{{ message }}</p>
  <a class="button" href="{{ url_for('index') }}">К заявкам</a>
</section>
{% endblock %}
